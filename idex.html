<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Palanquées</title>
    <!-- Tailwind CSS pour un design moderne et mobile-first -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .print-hide { @media print { display: none; } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- APPLICATION PRINCIPALE -->
    <div id="app-screen" class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- En-tête -->
        <div class="flex justify-between items-center border-b border-slate-300 pb-4 mb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-blue-900">🤿 Cahier de Palanquées</h1>
                <p class="text-slate-500 text-sm mt-1">Génération et consultation simplifiée</p>
            </div>
        </div>

        <!-- MODE SÉLECTION -->
        <div id="mode-selection" class="print-hide bg-white p-6 rounded-xl shadow-sm text-center mb-6">
            <h2 class="text-xl font-bold mb-4">Que voulez-vous faire ?</h2>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button onclick="showCreator()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition">Créer une nouvelle palanquée</button>
                <button onclick="showViewer()" id="btn-go-view" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-lg font-medium transition hidden">Voir la palanquée reçue</button>
            </div>
        </div>

        <!-- INTERFACE CRÉATION (DP) -->
        <div id="creator-section" class="print-hide bg-white p-6 rounded-xl shadow-sm hidden mb-6">
            <h2 class="text-xl font-bold text-slate-700 mb-4 border-b pb-2">📋 Infos Générales</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Site de plongée</label>
                    <input type="text" id="input-site" placeholder="Ex: Épave du Togo" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Date & Heure</label>
                    <input type="datetime-local" id="input-date" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Directeur de Plongée (DP)</label>
                    <input type="text" id="input-dp" placeholder="Nom du DP" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <h2 class="text-xl font-bold text-slate-700 mb-4 border-b pb-2">👥 Les Palanquées</h2>
            <div id="palanquees-inputs-container" class="space-y-4"></div>

            <div class="mt-4 flex flex-wrap gap-3">
                <button onclick="addPalanqueeInput()" class="bg-slate-800 hover:bg-slate-900 text-white text-sm px-4 py-2 rounded-lg font-medium">+ Ajouter une Palanquée</button>
                <button onclick="generateShareLink()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-5 py-2 rounded-lg font-medium ml-auto">🔗 Générer le lien de partage</button>
            </div>

            <!-- Zone de partage -->
            <div id="share-zone" class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg hidden">
                <p class="text-sm font-semibold text-blue-800 mb-2">Lien prêt à être partagé :</p>
                <div class="flex gap-2">
                    <input type="text" id="share-url" readonly class="bg-white border text-sm rounded-lg p-2 flex-grow focus:outline-none">
                    <button onclick="copyLink()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-4 py-2 rounded-lg font-medium">Copier</button>
                </div>
                <p id="copy-success" class="text-emerald-600 text-xs mt-1 hidden font-medium">Lien copié dans le presse-papier ! Vous pouvez l'envoyer sur WhatsApp.</p>
            </div>
        </div>

        <!-- INTERFACE AFFICHAGE / CONSULTATION -->
        <div id="viewer-section" class="bg-white p-6 rounded-xl shadow-md hidden">
            <div class="text-center sm:text-left border-b pb-4 mb-4">
                <h2 id="view-site" class="text-2xl font-bold text-blue-900">Site non spécifié</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 text-sm text-slate-600 mt-2">
                    <p>📅 <span id="view-date">-</span></p>
                    <p class="sm:text-right">⚓ DP : <span id="view-dp" class="font-semibold">-</span></p>
                </div>
            </div>

            <div id="palanquees-display-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            
            <div class="mt-6 text-center print-hide">
                <button onclick="window.print()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm px-4 py-2 rounded-lg font-medium">🖨️ Imprimer / PDF</button>
            </div>
        </div>

    </div>

    <!-- LOGIQUE JAVASCRIPT -->
    <script>
        let palanqueeCount = 0;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('d')) {
                document.getElementById('btn-go-view').classList.remove('hidden');
                showViewer();
            } else {
                showCreator();
            }
        };

        function showCreator() {
            document.getElementById('creator-section').classList.remove('hidden');
            document.getElementById('viewer-section').classList.add('hidden');
            if(palanqueeCount === 0) addPalanqueeInput();
        }

        function showViewer() {
            document.getElementById('creator-section').classList.add('hidden');
            document.getElementById('viewer-section').classList.remove('hidden');
            loadPalanqueesFromUrl();
        }

        function addPalanqueeInput() {
            palanqueeCount++;
            const container = document.getElementById('palanquees-inputs-container');
            
            const html = `
                <div class="p-4 bg-slate-50 border rounded-lg relative" id="palanquee-input-card-${palanqueeCount}">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold text-blue-800 text-sm">Palanquée N°${palanqueeCount}</h3>
                        <button onclick="removePalanqueeInput(${palanqueeCount})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Supprimer</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-2">
                        <input type="text" placeholder="Guide de Palanquée (GP)" class="p-2 border rounded-md text-sm field-gp">
                        <input type="text" placeholder="Prof. Max Prévue (m)" class="p-2 border rounded-md text-sm field-prof">
                        <input type="text" placeholder="Durée Max Prévue (min)" class="p-2 border rounded-md text-sm field-duree">
                    </div>
                    <textarea placeholder="Noms et niveaux des plongeurs (un par ligne)" rows="3" class="w-full p-2 border rounded-md text-sm field-plongeurs"></textarea>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        function removePalanqueeInput(id) {
            document.getElementById(`palanquee-input-card-${id}`).remove();
        }

        function generateShareLink() {
            const data = {
                site: document.getElementById('input-site').value,
                date: document.getElementById('input-date').value,
                dp: document.getElementById('input-dp').value,
                palanquees: []
            };

            const containers = document.getElementById('palanquees-inputs-container').children;
            for (let el of containers) {
                data.palanquees.push({
                    gp: el.querySelector('.field-gp').value,
                    prof: el.querySelector('.field-prof').value,
                    duree: el.querySelector('.field-duree').value,
                    plongeurs: el.querySelector('.field-plongeurs').value.split('\n').filter(p => p.trim() !== "")
                });
            }

            const jsonString = JSON.stringify(data);
            const encodedData = btoa(unescape(encodeURIComponent(jsonString)));
            
            const shareUrl = window.location.origin + window.location.pathname + '?d=' + encodedData;
            
            document.getElementById('share-url').value = shareUrl;
            document.getElementById('share-zone').classList.remove('hidden');
        }

        function copyLink() {
            const copyText = document.getElementById('share-url');
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            
            const success = document.getElementById('copy-success');
            success.classList.remove('hidden');
            setTimeout(() => success.classList.add('hidden'), 4000);
        }

        function loadPalanqueesFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('d')) return;

            try {
                const encodedData = urlParams.get('d');
                const jsonString = decodeURIComponent(escape(atob(encodedData)));
                const data = JSON.parse(jsonString);
